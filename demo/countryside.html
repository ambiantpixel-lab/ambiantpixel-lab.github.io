function crown(b,cx,cy,r,p,o={}){const sx=o.sx||1.15,sy=o.sy||1,lb=o.lb||0,rough=o.rough===undefined?.55:o.rough,fq=o.fq||1,bl=o.bloss||0;

 for(let y=y0;y<=y1;y++){if(y<0||y>=b.h)continue;for(let x=x0;x<=x1;x++){if(x+b.dx<0||x+b.dx>=b.w)continue;

function fieldKind(id,ss){
 const m={wheat:{spring:'young',summer:hash(id,5)<.3?'stub':'wheat',autumn:hash(id,6)<.5?'stub':'plow',winter:'sprout'},
  maize:{spring:'sprouting',summer:'crop',autumn:'maized',winter:'plow'},plow:{spring:'sprouting',summer:'plow',autumn:'plow',winter:'plow'},

function genPlain(){const b=new Buf(),cm=new Buf();const yr=220,ss=SEAS.name,snow=env.snowc;
 const BB=[173,176.5,181,187,194.5,204,214.5,WY+1],NB=BB.length-1;
 const proj=(x,y)=>VPX+(x-VPX)*(yr-VPY)/(y-VPY);
 const cols=[],flds=[];
 for(let k=0;k<NB;k++){const yk=(BB[k]+BB[k+1])/2,x0=proj(-20,yk),x1=proj(W+20,yk);const c=[];let x=x0-rnd(0,60);while(x<x1+60){c.push(x);x+=rnd(42,128)}cols.push(c);
  const f=[];for(let i=0;i<=c.length;i++){const cx=(c[Math.max(0,i-1)]+(c[i]||c[i-1]+60))/2,right=cx>VPX+60,r=R();
   const id=r<.27?'wheat':r<.4?'maize':r<.52?'plow':r<.72?'meadow':r<.8?(right?'lav':'wheat'):r<.88?'sunf':'colza';
   f.push({id,t:fieldKind(id,ss),uid:k*1000+i,dir:R()<.6?'c':'h',per:rnd(2.6,4.4),F:rnd(1100,1900),off:R(),tram:rnd(16,30),sh:rnd(-.08,.08)})}
  flds.push(f)}
 const FT=new Uint8Array(W*H);META.FT=FT;
 const bands=new Float32Array(NB+1);
 for(let x=0;x<W;x++){const pt=PT(x);for(let k=0;k<=NB;k++)bands[k]=k===0?pt:k===NB?WY+1:BB[k]+(fbm1(x*.007+k*13.1)-.5)*(2+k*1.2);
  let k=0;for(let y=Math.floor(pt);y<WY;y++){while(k<NB-1&&y>=bands[k+1])k++;
   const d=y-VPY,X=proj(x,y),c=cols[k];let lo=0,hi=c.length;while(lo<hi){const m=(lo+hi)>>1;if(c[m]<=X)lo=m+1;else hi=m}
   const f=flds[k][lo],dl=lo>0?X-c[lo-1]:99,dr=lo<c.length?c[lo]-X:99,dx=Math.min(dl,dr)*d/(yr-VPY),dy=Math.min(y-bands[k],bands[k+1]-y);
   const depth=clamp((y-173)/53,0,1);let col;
   if(dx<.8||dy<.8&&k>0){col=snow?ramp(SNOWG,.5+hash(x,y)*.3,x,y):ramp(SEAS.grass,.28+hash(x,y)*.3+(dy<.8?.08:0),x,y);FT[y*W+x]=0}
   else{const tri=f.dir==='c'?Math.abs(((X/f.per)%1+1)%1-.5)*2:Math.abs(((f.F/d+f.off)%1+1)%1-.5)*2;
    const big=(fbm2(N2,x*.025+f.uid,y*.07,3)-.5)*.42,gr=(hash(x,y)-.5)*.16;let v,p;
    switch(snow?'snow':f.t){

      if(hash(x*3,y)<.004+depth*.006&&ss!=='autumn'){col=P(hash(y,x)<.7?'#d83a26':'#3a60c8');break}break}
     case'young':p=YOUNG;v=.5+big+gr+(tri<.45?.12:-.12)*(1-depth*.4);break;
     case'stub':p=STUB;v=.55+big*.7+gr+(tri<.5?.1:-.08);break;

     case'lav':{if(tri<.62){p=LAV;v=.35+(.62-tri)*.9+big*.6+gr*1.5}else{p=SOIL;v=.3+gr}break}

     case'sunf':{if(tri<.62){const hx=(x+((y>>1)&1))%2===0&&y%2===0;if(hx){p=SUNF;v=.55+gr*2+big}else{p=CROP;v=.3+gr+big}}else{p=CROP;v=.18+gr}break}

 if(ss!=='winter'){const ps=TP[ss],p=ss==='autumn'?TP.autumn[fg?0:2]:ps[0],p2=ss==='autumn'?TP.autumn[fg?4:1]:ps[2];const cs=[];

  if(due){window.__still=now;last=now;const before=simMs;syncClock();const gap=Math.min(90,Math.max(0,(simMs-before)/1000));for(let i=0;i<gap*10;i++)simStepAll(.1);tick(0)}return}
 _apS();window.__still=0;const dt=(now-last)/1000;if(dt<1/FPS-.004)return;last=now;const d=Math.min(dt,.1);fpsA=lerp(fpsA,1/Math.max(dt,.001),.05);
 if(SPEED===1)syncClock();else simMs+=d*1000*SPEED;
 simStepAll(d);tick(d);

addEventListener('keydown',e=>{const k=e.key.toLowerCase();
 if(k==='h'){hudOn=!hudOn;hud.style.display=hudOn?'block':'none'}
 if(k==='t'){SPEED=SPEED===1?60:SPEED===60?600:1;if(SPEED===1)hourOffset=(simMs-Date.now())/3600e3}
 if(k==='n'||k==='p'){const d=k==='n'?1:-1;hourOffset+=d;simMs+=d*3600e3}
 if(k==='r')env.forceRain=env.forceRain===null?.8:env.forceRain>0?0:null;
 if(k==='e'){const ks=['car','flock','ducks','rabbit','plane','star','rainbow'];spawn(ks[(Math.random()*ks.length)|0])}});
main.addEventListener('pointerdown',e=>{const r=main.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;
 if(y>WY&&y<WY+14){fish={x,t:0,dir:Math.random()<.5?1:-1};ripple(x,y,6)}else if(env.dark>.5){for(let i=0;i<6;i++){const f=E.flies[(Math.random()*E.flies.length)|0];if(f){f.x=x+mr(-10,10);f.y=y+mr(-10,10)}}}else{for(let i=0;i<3;i++){const b=E.bf[(Math.random()*E.bf.length)|0];b.x=x;b.y=y}}});

function updEvents(dt){}

const S={get speed(){return SPEED},set speed(v){v=+v||1;if(v===1&&SPEED!==1)hourOffset=(simMs-Date.now())/3600e3;SPEED=v},
 get hour(){return env.h},set hour(v){const d=((((+v-clock(simMs).h)%24)+36)%24)-12;if(Math.abs(d)>1/60){simMs+=d*3600e3;hourOffset+=d}},
 get rain(){return env.rain},get snow(){return env.snow},get t(){return simMs/1000},
 raining:false,_rT:0,get rainT(){return this._rT},set rainT(v){this._rT=+v;env.forceRain=this.raining?+v:0},

 for(const c of L.clouds)c.a=c.th<env.cloud*1.3+.12?1:0;

 if(hudOn)hud.style.display='block';

 for(let k=0;k<300;k++)simStepAll(.1);
 try{tick(0)}catch(e){console.error(e)}window.__ready=1;_apS()})();
