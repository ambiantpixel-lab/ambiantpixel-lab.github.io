 if(isNY()&&S.fwT<=0)S.fwT=40;
 if(isXmas()&&S.night>.5&&!sleigh&&RR()<dt/300)spawn('sleigh')}

// ===================== RENDU =====================
function render(){const t=S.t;G.globalAlpha=1;G.globalCompositeOperation='source-over';
 G.drawImage(skyC,0,0);drawTwinkle(t);drawAurora(t);drawSunMoon();drawBolt();drawClouds();drawFire();drawShoot();drawSleigh(t);
 G.drawImage(landC,0,0);farWobble(t);liveCity(t);drawFireRefl(t);glitter(t,SHORE+2,MW,true);drawFerry(t);
 if(S.fogEff>.02){const m=MIST[0];G.globalAlpha=Math.min(1,S.fogEff*.8);G.drawImage(m.c,-((t*m.sp+m.off)%200)|0,SHORE-12);G.globalAlpha=1}
 G.drawImage(LY.ca.c,0,0);signal();drawPerch();
 drawTrain(t);
 G.drawImage(LY.br.c,0,0);bridgeLamps(t);trainSpill();
 nearWater(t);glitter(t,MW+1,H,false);drawBoats(t);drawWhale(t);drawFish();
 drawGulls(t);drawUFO(t);drawWeather(t)}

// ===================== BOUCLE / ENTRÉES =====================
function fit(){const iw=innerWidth,ih=innerHeight;let s;
 if(Q.get('fit')==='contain')s=Math.min(iw/W,ih/H);
 else{s=Math.ceil(ih/H-1e-9);if(ih/s<H*.875||W*s<iw)s=Math.max(iw/W,ih/H)}
 VIEW.ds=s;document.documentElement.dataset.view=W+'x'+H+'@'+(+s.toFixed(4))+' win='+iw+'x'+ih;main.style.width=W*s+'px';main.style.height=H*s+'px';main.style.left=Math.round((iw-W*s)/2)+'px';main.style.top=Math.round((ih-H*s)*VY)+'px'}
let rzT=0;addEventListener('resize',()=>{fit();clearTimeout(rzT);rzT=setTimeout(()=>{if(Q.has('w')||Q.has('nw')||FREEZE)return;if(viewFor(innerWidth,innerHeight).W!==W)location.reload()},500)});
const hud=document.getElementById('hud');let fpsA=30,frameN=0;const FPS=+(Q.get('fps')||30);let last=performance.now();
function frame(now){requestAnimationFrame(frame);if(window.__pause){if(window.__still&&now-window.__still<60000)return;window.__still=now;last=now;updWorld(1/30);render();return}window.__still=0;const dt=(now-last)/1000;if(dt<1/FPS-.004)return;last=now;const d=Math.min(dt,.1);fpsA=lerp(fpsA,1/Math.max(dt,.001),.05);
 updWorld(d);updEvents(d);render();frameN++;if(frameN%60===0){const ds=document.documentElement.dataset;ds.errs=window.__errs.length;ds.frames=frameN;ds.train=TR?TR.kind+':'+TR.cars.length:'-';ds.hour=S.hour.toFixed(2)}
 if(S.hud){const h=S.hour;hud.textContent=`NIGHT TRAIN  ${W}×${H} x${+(VIEW.ds||0).toFixed(2)}  ${String(h|0).padStart(2,'0')}:${String(MINUTE()).padStart(2,'0')}  x${S.speed}  ${S.snow?'neige':'pluie'} ${(S.rain*100)|0}%  brume ${(S.fogEff*100)|0}%  ${fpsA|0} fps\n${TR?'train '+TR.kind+' ('+TR.cars.length+' voitures)':'prochain train dans '+Math.max(0,S.trainWait|0)+' s'}\n[R] pluie  [F] brume  [T] vitesse  [N] +3h  [E] évènement  [H] masquer`}}
const KON=['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];let kon=0;
addEventListener('keydown',e=>{const k=e.key;kon=(k===KON[kon]||k.toLowerCase()===KON[kon])?kon+1:(k===KON[0]?1:0);if(kon===KON.length){kon=0;S.konami=45;spawn('fireworks');if(!TR)spawnTrain();else S.trainWait=0}
 const l=k.toLowerCase();
 if(l==='r')toggleRain(!S.raining);
 if(l==='f'){S.fogT=S.fogT>.1?0:.6;S.fTimer=mr(300,900)}
 if(l==='t'){const sp=[1,60,600];S.speed=sp[(sp.indexOf(S.speed)+1)%sp.length];if(S.speed===1&&!Q.has('hour'))S.hour=realHour()}
 if(l==='n'){if(S.speed===1)S.speed=60;S.hour=(S.hour+3)%24}
 if(l==='e')spawn(mpick(['train','freight','aurora','fireworks','whale','ufo','star','storm']));
 if(l==='h'){S.hud=!S.hud;hud.style.display=S.hud?'block':'none'}});
main.addEventListener('pointerdown',e=>{const r=main.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;
 if(TR){const X=Math.round(TR.x);for(const w of TR.wins){if(x>=X+w.x-1&&x<=X+w.x+w.w+1&&y>=w.y-2&&y<=w.y+w.h+1){if(HX[w.occ]!==undefined&&(w.lit||S.day>.3)){w.wave=2.8;E.hearts.push({tx:w.x+(w.w>>1),y:w.y-4,t:0})}else{w.lit=!w.lit}return}}}
 if(y>MW){ripple(x,y,9,1);for(let i=0;i<5;i++)E.splash.push({x,y,vx:mr(-18,18),vy:mr(-36,-14),t:0});if(RR()<.35)E.fish.push({x,y,d:RR()<.5?1:-1,t:0});return}
 if(y<SHORE-24){if(S.night>.5)spawnStar();else{const d=x<W/2?1:-1;E.gulls.push({x:d>0?-8:W+8,y:clamp(y,40,150),vx:d*mr(14,20),ph:mr(0,6),gl:0,vy:0})}}});

// ===================== DÉMARRAGE =====================
build();
if(FREEZE){S.speed=0;if(!Q.has('hour'))S.hour=12}
S.night=nightF(S.hour);S.day=1-S.night;S.lamp=clamp(.28+S.night*.82+S.rain*.3,0,1);S.fogEff=Math.max(S.fog,.34*gauss(S.hour,6.4,.9));S.cloud=clamp(.3+.3*N1(7)+S.rain*.85,0,1);
for(const c of CLOUDS)c.a=c.th<S.cloud?1:0;
regrade();S.stamp=Math.floor(S.hour*15)+'_'+Math.round(S.rain*20)+'_'+Math.round(S.fog*10)+'_'+(S.snow?1:0);
fillBoats(true);
if(S.day>.45&&!S.raining)for(let i=0;i<Math.round(4*K)+2;i++){const d=RR()<.5?1:-1;E.gulls.push({x:mr(.05,.95)*W,y:mr(50,150),vx:d*mr(10,18),ph:mr(0,6.28),gl:0,vy:0})}
if(RR()<.5||FREEZE)ferry={dir:RR()<.5?1:-1,x:W*mr(.38,.5),sp:mr(4,6)};
fit();
const FX=(Q.get('fx')||'').split(',').filter(Boolean);
window.AMBIANT={theme:'nighttrain',W,H,K,view:VIEW,anchors:{hero:META.hero,needle:META.needle,wheel:META.wheel,lighthouse:META.lh,signal:SIG,piers:PIERS,masts:MASTS.filter(m=>m>=0&&m<W),buoy:META.buoy},lines:{SHORE,CWY,TOP,RAIL,DBOT,MW},spawn,state:S,train:()=>TR};
if(FREEZE){const FT=Math.max(0,+(Q.get('ft')||3));
 if(!FX.includes('freight')&&!FX.includes('ghost'))spawnTrain();
 for(const ev of FX)spawn(ev);
 if(TR)TR.x=Math.round(W*.86)-(TR.locoX+LOCO_L)-TR.sp*FT;
 for(const b of E.drops)b.dead=1;
 for(let i=0,n=S.rain*(S.snow?0:W*.5);i<n;i++){const z=RR(),end=z<.32?mr(MW+2,H):z<.5?mr(TOP-1,RAIL):mr(SHORE-30,MW);E.drops.push({x:mr(-20,W),y:mr(-10,end),vy:mr(290,370),end})}
 if(S.snow)for(let i=0,n=S.rain*W*.35;i<n;i++)E.flakes.push({x:mr(0,W),y:mr(0,H),vy:mr(9,20),ph:mr(0,6.28),end:H+5,s:RR()<.2?2:1,b:mr(.55,.95)});
 const n=Math.round(FT*30);for(let i=0;i<n;i++)updWorld(1/30);render();window.__frozen=true;document.title+=' [frozen]'}
else{for(const ev of FX)spawn(ev);
 if(Q.has('sim')){const n=+Q.get('sim')|0,ks=new Set();let mx=0;const a0=performance.now();for(let i=0;i<n;i++){updWorld(1/30);updEvents(1/30);render();if(TR)ks.add(TR.kind);if(i%300===150&&!TR)spawnTrain();if(i%450===0)spawn(mpick(['aurora','fireworks','whale','ufo','star','storm','freight','sleigh','snow']));if(i%600===0)S.konami=5;if(i%200===100&&TR&&TR.wins.length){TR.wins[0].wave=2}
   if(i===400){for(const k of[...KON,'r','e','f','t','n','h','h','t','t'])dispatchEvent(new KeyboardEvent('keydown',{key:k}));const r=main.getBoundingClientRect();for(const[px,py]of[[.5,.7],[.5,.95],[.3,.2]])main.dispatchEvent(new PointerEvent('pointerdown',{clientX:r.left+r.width*px,clientY:r.top+r.height*py}));if(TR&&TR.wins.length){const w=TR.wins[0];main.dispatchEvent(new PointerEvent('pointerdown',{clientX:r.left+(TR.x+w.x+2)/W*r.width,clientY:r.top+(w.y+3)/H*r.height}))}}}
  const ds=document.documentElement.dataset;ds.errs=window.__errs.length;ds.sim=n;ds.ms=((performance.now()-a0)/n).toFixed(2);ds.kinds=[...ks].join(',');ds.hour=S.hour.toFixed(2)}
 requestAnimationFrame(frame)}
if(Q.has('dbg'))document.getElementById('hud').textContent=JSON.stringify({errs:window.__errs,W,train:TR&&{kind:TR.kind,n:TR.cars.length,c32:TR.c32},night:S.night});
</script><script>/* Ambiant Pixel site bridge */addEventListener('message',function(e){if(e.origin!==location.origin&&location.protocol!=='file:')return;var d=e.data||{};if(d.ap==='pause')window.__pause=!!d.v;else if(d.ap==='fx'&&typeof spawn==='function'&&/^[a-z]+$/.test(d.v))spawn(d.v)});</script></body></html>
