'use strict';
// =====================================================================
// ROOFTOPS OF PARIS — Ambiant Pixel (méthode Jungle : rendu procédural pixel par pixel)
// Toits de Paris en surplomb : 6 rangs de toits jusqu'à la brume + premier plan (souche, lucarnes, terrasse).
// Paramètres : fit fps freeze h hour hud lat noon now nw paris rain seed snow speed vx w (+ vy, ft)
// =====================================================================
// ===================== CORE =====================
const H=288,HOR=97;
const Q=new URLSearchParams(location.search);/*AP-16x9-LOCK*/for(const k of ['w','h','nw'])Q.delete(k);Q.set('w','512');Q.set('h','288');Q.set('nw','512');{const f0=Q.get('fit'),af=()=>{if(innerWidth>innerHeight*16/9+1)Q.set('fit','contain');else if(f0===null)Q.delete('fit');else Q.set('fit',f0)};af();addEventListener('resize',af)}
const FREEZE=Q.get('freeze')==='1';
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
if(FREEZE)Math.random=mulberry32((+(Q.get('seed')||32))^0x5f3759df);
const SEED=+(Q.get('seed')||32);
let R=mulberry32(SEED);
const rnd=(a,b)=>b===undefined?R()*(a===undefined?1:a):a+R()*(b-a);
const rint=(a,b)=>Math.floor(rnd(a,b+1));
const rpick=a=>a[Math.floor(R()*a.length)];
const mr=(a,b)=>b===undefined?Math.random()*(a===undefined?1:a):a+Math.random()*(b-a);
const mri=(a,b)=>Math.floor(mr(a,b+1));
const mpick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,sstep=t=>{t=clamp(t,0,1);return t*t*(3-2*t)};
function hex(h){h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
const mixc=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];
const mulc=(a,b)=>[a[0]*b[0]/255,a[1]*b[1]/255,a[2]*b[2]/255];
const rgbs=(c,a)=>a===undefined?`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`:`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${(+a).toFixed(3)})`;
const pack=(r,g,b,a=255)=>((a<<24)|(b<<16)|(g<<8)|r)>>>0;
const P=h=>{const c=hex(h);return pack(c[0],c[1],c[2])};
const pal=a=>a.map(P);
const BAY=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5].map(v=>(v+.5)/16);
const dith=(x,y,t)=>t>BAY[((y&3)<<2)|(x&3)];
const hash=(x,y=0)=>{let h=Math.imul(x|0,374761393)+Math.imul(y|0,668265263)+Math.imul(SEED,1442695)|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296};
// hash météo (identique à l'ancienne version : même temps qu'il fait sur toutes les machines)
const whash=(x,y=0,z=0)=>{let h=Math.imul(x|0,374761393)+Math.imul(y|0,668265263)+Math.imul(z|0,1442695041)|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296};
function makeN1(seed){const r=mulberry32(seed),p=new Float32Array(1024);for(let i=0;i<1024;i++)p[i]=r();return x=>{const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return lerp(p[i&1023],p[(i+1)&1023],u)}}
function makeN2(seed){const r=mulberry32(seed),S=256,p=new Float32Array(S*S);for(let i=0;i<S*S;i++)p[i]=r();
 return(x,y)=>{const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
 const x0=xi&255,x1=(xi+1)&255,y0=(yi&255)*S,y1=((yi+1)&255)*S;
 return lerp(lerp(p[y0+x0],p[y0+x1],u),lerp(p[y1+x0],p[y1+x1],u),v)}}
const N1=makeN1(SEED+1),N2=makeN2(SEED+2),N3=makeN2(SEED+3);
function fbm1(x,o=4){let s=0,a=.5,t=0,f=1;for(let i=0;i<o;i++){s+=a*N1(x*f+i*31.7);t+=a;a*=.5;f*=2}return s/t}
function fbm2(n,x,y,o=3){let s=0,a=.5,t=0,f=1;for(let i=0;i<o;i++){s+=a*n(x*f+i*17.3,y*f+i*9.1);t+=a;a*=.5;f*=2.03}return s/t}
function cv(w,h){const c=document.createElement('canvas');c.width=Math.max(1,Math.ceil(w));c.height=Math.max(1,Math.ceil(h));const g=c.getContext('2d');g.imageSmoothingEnabled=false;return[c,g]}
class Buf{constructor(w=WW,h=H){this.w=Math.ceil(w);this.h=Math.ceil(h);this.dx=0;this.img=new ImageData(this.w,this.h);this.d=new Uint32Array(this.img.data.buffer)}
 set(x,y,c){x=Math.floor(x+this.dx);y=Math.floor(y);if(x<0||y<0||x>=this.w||y>=this.h)return;this.d[y*this.w+x]=c}
 get(x,y){x=Math.floor(x+this.dx);y=Math.floor(y);if(x<0||y<0||x>=this.w||y>=this.h)return 0;return this.d[y*this.w+x]}
 rect(x,y,w,h,c){for(let j=0;j<h;j++)for(let i=0;i<w;i++)this.set(x+i,y+j,c)}
 outline(col){const d=this.d,w=this.w,h=this.h,o=new Uint32Array(d);for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=y*w+x;if(d[i])continue;if((x>0&&d[i-1])||(x<w-1&&d[i+1])||(y>0&&d[i-w])||(y<h-1&&d[i+w]))o[i]=col}this.d.set(o)}
 canvas(){const[c,g]=cv(this.w,this.h);g.putImageData(this.img,0,0);return c}}
function ramp(p,v,x,y){v=clamp(v,0,.9999)*(p.length-1);const i=Math.floor(v);return p[Math.min(p.length-1,i+(dith(x|0,y|0,v-i)?1:0))]}
function spr(rows,pl){const h=rows.length,w=Math.max(...rows.map(r=>r.length));const[c,g]=cv(w,h);for(let y=0;y<h;y++)for(let x=0;x<rows[y].length;x++){const ch=rows[y][x];if(ch!=='.'&&pl[ch]){g.fillStyle=pl[ch];g.fillRect(x,y,1,1)}}return c}
function flipC(c){const[f,g]=cv(c.width,c.height);g.translate(c.width,0);g.scale(-1,1);g.drawImage(c,0,0);return f}
function disc(g,x,y,r,col){g.fillStyle=col;for(let j=-r;j<=r;j++){const w=Math.floor(Math.sqrt(Math.max(0,r*r-j*j+r*.8)));g.fillRect(Math.round(x-w),Math.round(y+j),w*2+1,1)}}
function glow(g,x,y,rgb,a,r=2){x=Math.round(x);y=Math.round(y);if(a<=.01)return;for(let k=r;k>=1;k--){disc(g,x,y,k*1.6,`rgba(${rgb},${(a*.18/k).toFixed(3)})`)}g.fillStyle=`rgba(${rgb},${a.toFixed(3)})`;g.fillRect(x,y,1,1);g.fillStyle=`rgba(${rgb},${(a*.5).toFixed(3)})`;g.fillRect(x-1,y,3,1);g.fillRect(x,y-1,1,3)}

// ===================== MULTI-FORMAT =====================

function viewFor(tw,th){tw=Math.max(1,tw|0||5120);th=Math.max(1,th|0||1440);let s=Math.ceil(th/H-1e-9),pp=true;if(th/s<H*.875){s=th/H;pp=false}return{tw,th,s,pp,W:Math.max(200,Math.ceil(tw/s-1e-9))}}
const VIEW=viewFor(+Q.get('w')||innerWidth,+Q.get('h')||innerHeight);
const W=Q.has('nw')?Math.max(200,+Q.get('nw')|0):Q.get('fit')==='contain'?Math.max(1024,VIEW.W):VIEW.W;
const WW=Math.max(W,1024),CX0=560;
const X0=W>=WW?0:Math.round(Q.has('vx')?clamp(+Q.get('vx'),0,1)*(WW-W):clamp(CX0-W/2,0,WW-W));
const K=W/1024;
window.AMBIANT={W,H,WW,X0,view:VIEW};

// ===================== TEMPS & SOLEIL (même modèle que l'ancienne version) =====================
let SPEED=+(Q.get('speed')||1),hourOffset=0;
let simMs=FREEZE?(Q.has('now')?+new Date(Q.get('now')):+new Date(2026,9,16,15,0)):Date.now();
if(Q.has('hour')){const d=new Date(simMs),h=+Q.get('hour');d.setHours(Math.floor(h),Math.round(h%1*60),0,0);simMs=+d}
const syncClock=()=>{if(!FREEZE&&SPEED===1)simMs=Date.now()+hourOffset*3600e3};
if(!FREEZE&&Q.has('hour'))hourOffset=(simMs-Date.now())/3600e3;
const PARIS=Q.get('paris')==='1';
const LAT=(PARIS?48.86:+(Q.get('lat')||14.6))*Math.PI/180;
const PFMT=PARIS?new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Paris',hour12:false,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):null;
function clock(ms){
 if(!PARIS){const d=new Date(ms);return{y:d.getFullYear(),mo:d.getMonth(),da:d.getDate(),h:d.getHours()+d.getMinutes()/60+d.getSeconds()/3600,mi:d.getMinutes()}}
 const o={};for(const p of PFMT.formatToParts(new Date(ms)))o[p.type]=+p.value;
 return{y:o.year,mo:o.month-1,da:o.day,h:(o.hour%24)+o.minute/60,mi:o.minute,off:((o.hour%24)-new Date(ms).getUTCHours()+24)%24}}
function sun(c){const doy=Math.floor((new Date(c.y,c.mo,c.da)-new Date(c.y,0,0))/864e5);
 const dec=-23.44*Math.PI/180*Math.cos(2*Math.PI*(doy+10)/365);
 const noon=Q.has('noon')?+Q.get('noon'):PARIS?12+c.off-.15:12.1;
 const ha=(c.h-noon)*15*Math.PI/180;
 const el=Math.asin(Math.sin(LAT)*Math.sin(dec)+Math.cos(LAT)*Math.cos(dec)*Math.cos(ha))*180/Math.PI;
 return{el,ha,dec}}
const moonPhase=ms=>{let p=(((ms-Date.UTC(2000,0,6,18,14))/864e5)%29.530588)/29.530588;return p<0?p+1:p};
function rainAt(ms){const m=new Date(ms).getMonth(),pB=[.2,.18,.16,.16,.15,.12,.1,.1,.13,.17,.2,.2][m];
 const B=5400e3,b=Math.floor(ms/B),t=(ms-b*B)/B;
 return(whash(b,4242)<pB?.35+whash(b,4343)*.65:0)*sstep(t/.12)*(1-sstep((t-.85)/.15))}
const winterAt=ms=>{const m=new Date(ms).getMonth();return m===11||m<=1};
const snowAt=ms=>winterAt(ms)&&whash(Math.floor(ms/5400e3),99)<.4?rainAt(ms):0;

// ===================== PALETTES =====================
const ZINCS=[pal(['#232a35','#2f3846','#3d4757','#4e5a6b','#626f81','#798798','#94a1b1','#b4bfcb']),
 pal(['#272c32','#343b42','#434b53','#545e66','#68737b','#808b92','#9ba5aa','#bac1c4']),
 pal(['#252c3b','#313b4e','#3f4b62','#506079','#647691','#7c8fa7','#98aabe','#b8c7d6'])];

const PLASTERS=[pal(['#6e5232','#896841','#a58252','#bd9a64','#d0b27c','#dec694']),pal(['#6e4c46','#8a6058','#a6786c','#bc9080','#cea896','#dcbcab']),
 pal(['#55575b','#6c6e72','#85878a','#9fa0a1','#b6b7b6','#c9c9c6']),pal(['#7a7870','#949288','#acaa9e','#c2c0b2','#d6d4c4','#e6e4d6']),pal(['#6c6038','#887a48','#a4955a','#bcad6e','#d0c286','#e0d49e'])];
const BRICK=pal(['#3a201a','#4e2a21','#64362a','#784232','#8e523c','#a2644a']);

const POT=pal(['#46200f','#622c16','#7e3c1c','#9a4e26','#b46434','#cc804a']);
const METAL=pal(['#18191e','#25282f','#353a43','#4a515c','#626b78','#828c98','#a6aeb8']);
const LEAF=pal(['#12291a','#1b3d20','#275326','#356a2e','#478438','#5f9e44','#80b858']);
const OLIVE=pal(['#1c2a1e','#283a28','#364c32','#46603c','#5a7448','#728a58','#8ea070']);

const WINC=['255,206,128','255,188,104','255,226,170','255,214,150','200,222,255','255,168,96'];

// ===================== LES RANGS DE TOITS =====================
// yt = ligne moyenne des faîtages, u = pixels par mètre (perspective), hz = brume atmosphérique
const ROWS=[[96,.38,.8],[99,.49,.76],[103,.63,.72],[108,.81,.53],[114,1.04,.48],[122,1.34,.43],[132,1.72,.25],[146,2.2,.2],[166,2.8,.07],[198,3.5,0]].map(([yt,u,hz])=>({yt,u,hz,wa:1-hz*.55}));
const NR=ROWS.length;
const META={};
function genRow(k){const o=ROWS[k],u=o.u,b=new Buf(),m=new Uint8Array(WW*H);
 const L={k,u,b,m,wins:[],pots:[],perch:[],tv:[],yt:o.yt,fg:0};
 const M=(x,y,v)=>{x=Math.floor(x);y=Math.floor(y);if(x<0||y<0||x>=WW||y>=H)return;m[y*WW+x]=v};
 const S=(x,y,c,mv)=>{b.set(x,y,c);M(x,y,mv||0)};
 const yb=k<NR-1?Math.min(H,ROWS[k+1].yt+Math.round(16*ROWS[k+1].u)+8):H;
 const BL=[];let x=-rint(2,12),id=0;
 while(x<WW+14){
  if(R()<.11&&x>20){const gw=Math.max(2,Math.round(u*rnd(6,13)));BL.push({gap:1,x,w:gw});x+=gw;continue}
  const w=Math.max(5,Math.round(u*rnd(11,23)));
  let dh=(fbm1(x*.011/Math.sqrt(u)+k*41)-.5)*u*13+(R()-.5)*u*4;if(R()<.13)dh-=u*rnd(3,7);
  const top=Math.round(o.yt+dh),rr=R();
  const rt=rr<.44?'mz':rr<.6?'ms':rr<.74?'tile':rr<.83?'flat':rr<.9&&u>=1.3?'atel':'mz2';
  const fr=R(),fs=rt==='tile'?(fr<.75?'plaster':'brick'):fr<.62?'stone':fr<.92?'plaster':'brick';
  const fp=fs==='stone'?rpick(STONES):fs==='brick'?BRICK:rpick(PLASTERS);const kd=R();
  BL.push({id:id++,x,w,top,rt,fs,fp,zp:rpick(ZINCS),bth:R(),shut:fs==='plaster'&&R()<.75,shc:rpick(SHUTC),flo:R()<.55?rnd(.12,.45):0,dorm:R()<.6?1:2,s:R()*100,bal:fs==='stone'?R()<.8:R()<.25,tone:rnd(-.09,.09),sp:Math.max(2,Math.round(u*rnd(2.2,3.4))),ww:Math.max(1,Math.round(u*(kd<.15?rnd(1.6,2.2):rnd(.8,1.3)))),whf:rnd(.48,.74),fh:Math.max(2,Math.round(u*rnd(2.7,3.5)))});
  x+=w}
 for(const B of BL){if(B.gap)continue;
  if(B.rt==='tile'){B.th=Math.max(2,Math.round(4.2*u));B.yC=B.top+B.th}
  else if(B.rt==='flat'){B.yC=B.top+Math.max(1,Math.round(u*.9))}
  else{B.tz=Math.max(1,Math.round(2.3*u));B.mh=Math.max(2,Math.round(3.6*u));B.yC=B.top+B.tz+B.mh}
  B.ht=B.rt==='mz2'?B.top-Math.max(2,Math.round(u*2.8)):B.top}
 // ---- colline lointaine (silhouette habitée, sans monument) ----
 if(k===0){const hx=WW*.3,hw=200;for(let xx=0;xx<WW;xx++){const pr=Math.exp(-(((xx-hx)/hw)**2)*2.2),top=Math.round(o.yt+4-pr*26-(fbm1(xx*.03+7)-.5)*6*pr);if(pr<.03)continue;
  for(let y=top;y<o.yt+14;y++){const d=y-top;let v=.5+(N2(xx*.5,y*.5)-.5)*.4;let c;const tree=fbm2(N3,xx*.09,y*.12,2)>.6;
   if(tree)c=ramp(LEAF,.35+(N2(xx,y)-.5)*.5-(d<1?-.2:0),xx,y);else{const bx=Math.floor((xx+(y>>2)*3)/4);v+=(hash(bx,y>>2)-.5)*.4;if((y&3)===0)v=.85;c=ramp(hash(bx,7)<.3?ZINCS[0]:STONE,v,xx,y);if((y&3)===2&&(xx&1)&&hash(xx,y)<.5)L.wins.push({x:xx,y,w:1,h:1,th:R(),c:rint(0,3),cur:0})}
   if(d===0)c=ramp(tree?LEAF:STONE,.8,xx,y);S(xx,y,c,d===0?1:undefined)}}}
 // ---- dômes (un ou deux, génériques) ----
 if(k>=3&&k<=6){const cand=BL.filter(B=>!B.gap&&B.w>u*12);if(cand.length&&R()<(k===5?1:.35)){const B=rpick(cand);B.dome=1;B.rt='flat';}}
 // ---- façades ----
 for(const B of BL){if(B.gap)continue;const fh=B.fh,sp=B.sp,ww=B.ww,wh=Math.max(1,Math.round(fh*B.whf));B.wh=wh;const{x,w,yC,fp}=B,nc=Math.max(1,Math.floor((w-1)/sp)),ox=x+Math.floor((w-nc*sp)/2)+Math.floor((sp-ww)/2);B.nc=nc;B.ox=ox;
  for(let y=yC;y<yb;y++){const fy=y-yC,r=((fy-2)%fh+fh)%fh;
   for(let xx=x;xx<x+w;xx++){let v=.6+B.tone+(N2(xx*.6+B.s,y*.6)-.5)*.24+(hash(xx,y)-.5)*.1-(fy/(yb-yC+1))*.08;
    if(B.fs==='stone'&&u>=1&&r===0)v-=.12;
    if(B.fs==='stone'&&u>=2&&r===Math.floor(fh/2)&&((xx+fy)&3)===0)v-=.06;
    if(B.fs==='brick'&&u>=1.4){if((y&1)===0)v-=.14;else if(((xx+((y>>1)&1)*2)&3)===0)v-=.1}
    if(B.fs==='plaster'&&N3(xx*.18+B.s,y*.12)>.66)v-=.12;// enduit écaillé, coulures
    if(xx===x)v+=.16;if(xx===x+w-1)v-=.22;
    if(fy===0)v=.92;else if(fy===1)v=.18;
    S(xx,y,ramp(fp,v,xx,y),fy===0?3:undefined)}}
  // balcons filants (2e et 5e étage haussmanniens)
  if(B.bal&&u>=.75)for(const fl of[0,3]){const by=yC+2+(fl+1)*fh-1;if(by>=yb)continue;

 let r=env.forceRain!==null?env.forceRain:rainAt(simMs);if(Q.has('rain'))r=+Q.get('rain');
 env.snow=(winterAt(simMs)&&whash(Math.floor(simMs/5400e3),99)<.4?r:0)+(Q.has('snow')?+Q.get('snow'):0);
 if(env.forceSnow)env.snow=Math.max(env.snow,.7);

 const mha=s.ha-env.moon*2*Math.PI,mdec=s.dec*Math.cos(2*Math.PI*env.moon);

  else{G.fillStyle=rgbs(mulc([96,100,112],mixc(AMB,HZC,.12)));if(p.st==='perch'){G.fillRect(p.x|0,(p.y|0)-1,2,1);G.fillRect((p.x|0)+(p.dir>0?2:-1),(p.y|0)-2+(p.peck?1:0),1,1)}else{const up=((simT*10+p.x)|0)%2;G.fillRect(p.x|0,p.y|0,2,1);G.fillRect((p.x|0)-1,(p.y|0)-up,1,1);G.fillRect((p.x|0)+2,(p.y|0)-up,1,1)}}}

function drawGarland(t,n,FA){const[px,py]=META.pole,ex=META.pwall[0]+1,on=env.lamps>.25&&(env.h>=17||env.h<1.6)&&env.rain<.6;

 const s=SPR.catSit;if(!s)return;const x=Math.round(cat.x-5),y=y0-11;G.drawImage(s[0],x,y);
 G.fillStyle=rgbs(mulc([23,21,28],FA));for(let i=0;i<8;i++){const tx=x+8+Math.round(i*.5+Math.sin(t*1.6+i*.5)*i*.25),ty=y+10-Math.round(i*.9);G.fillRect(tx,ty,1,1)}}

 _apS();window.__still=0;const dt=(now-last)/1000;if(dt<1/FPS-.004)return;last=now;const d=Math.min(dt,.1);fpsA=lerp(fpsA,1/Math.max(dt,.001),.05);

addEventListener('keydown',e=>{const k=e.key.toLowerCase();
