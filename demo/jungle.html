<style>html,body{margin:0;height:100%;background:#05070d;overflow:hidden;cursor:default}canvas{position:absolute;image-rendering:-webkit-optimize-contrast;image-rendering:crisp-edges;image-rendering:pixelated}#hud{position:fixed;left:12px;bottom:12px;font:12px/1.5 ui-monospace,monospace;color:#cfe;background:#000a;padding:8px 10px;border-radius:6px;display:none;white-space:pre;z-index:2}</style></head><body><canvas id="c"></canvas><div id="hud"></div><script>
'use strict';
// ===================== CORE =====================
const H=288,WY=232,WB=262;
const Q=new URLSearchParams(location.search);
// --- FREEZE (rendu déterministe) ---
const FREEZE=Q.get('freeze')==='1';
if(FREEZE){Math.random=mulberry32((+(Q.get('seed')||32))^0x5f3759df);const T0=Q.has('now')?+new Date(Q.get('now')):Date.UTC(2026,9,5,10,0,0),_D=Date;window.Date=class extends _D{constructor(...a){super(...(a.length?a:[T0]))}static now(){return T0}}}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const SEED=+(Q.get('seed')||32);
let R=mulberry32(SEED);
const rnd=(a,b)=>b===undefined?R()*(a===undefined?1:a):a+R()*(b-a);
const rint=(a,b)=>Math.floor(rnd(a,b+1));
const mr=(a,b)=>b===undefined?Math.random()*(a===undefined?1:a):a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,sstep=t=>{t=clamp(t,0,1);return t*t*(3-2*t)};
function hex(h){h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
const mixc=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];
const mulc=(a,b)=>[a[0]*b[0]/255,a[1]*b[1]/255,a[2]*b[2]/255];
const rgbs=(c,a)=>a===undefined?`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`:`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const pack=(r,g,b,a=255)=>((a<<24)|(b<<16)|(g<<8)|r)>>>0;
const P=h=>{const c=hex(h);return pack(c[0],c[1],c[2])};
const pal=a=>a.map(P);
const BAY=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5].map(v=>(v+.5)/16);
const dith=(x,y,t)=>t>BAY[((y&3)<<2)|(x&3)];
const hash=(x,y=0)=>{let h=Math.imul(x|0,374761393)+Math.imul(y|0,668265263)+Math.imul(SEED,1442695)|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296};
function makeN1(seed){const r=mulberry32(seed),p=new Float32Array(1024);for(let i=0;i<1024;i++)p[i]=r();return x=>{const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return lerp(p[i&1023],p[(i+1)&1023],u)}}
function makeN2(seed){const r=mulberry32(seed),S=256,p=new Float32Array(S*S);for(let i=0;i<S*S;i++)p[i]=r();
 return(x,y)=>{const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
 const x0=xi&255,x1=(xi+1)&255,y0=(yi&255)*S,y1=((yi+1)&255)*S;
 return lerp(lerp(p[y0+x0],p[y0+x1],u),lerp(p[y1+x0],p[y1+x1],u),v)}}
const N1=makeN1(SEED+1),N2=makeN2(SEED+2),N3=makeN2(SEED+3);
function fbm1(x,o=4){let s=0,a=.5,t=0,f=1;for(let i=0;i<o;i++){s+=a*N1(x*f+i*31.7);t+=a;a*=.5;f*=2}return s/t}
function fbm2(n,x,y,o=3){let s=0,a=.5,t=0,f=1;for(let i=0;i<o;i++){s+=a*n(x*f+i*17.3,y*f+i*9.1);t+=a;a*=.5;f*=2.03}return s/t}
function cv(w,h){const c=document.createElement('canvas');c.width=Math.max(1,Math.ceil(w));c.height=Math.max(1,Math.ceil(h));const g=c.getContext('2d');g.imageSmoothingEnabled=false;return[c,g]}
class Buf{constructor(w=W,h=H){this.w=Math.ceil(w);this.h=Math.ceil(h);this.dx=0;this.img=new ImageData(this.w,this.h);this.d=new Uint32Array(this.img.data.buffer)}
 set(x,y,c){x=Math.floor(x+this.dx);y=Math.floor(y);if(x<0||y<0||x>=this.w||y>=this.h)return;this.d[y*this.w+x]=c}
 get(x,y){x=Math.floor(x+this.dx);y=Math.floor(y);if(x<0||y<0||x>=this.w||y>=this.h)return 0;return this.d[y*this.w+x]}
 rect(x,y,w,h,c){for(let j=0;j<h;j++)for(let i=0;i<w;i++)this.set(x+i,y+j,c)}
 outline(col){const d=this.d,w=this.w,h=this.h,o=new Uint32Array(d);for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=y*w+x;if(d[i])continue;if((x>0&&d[i-1])||(x<w-1&&d[i+1])||(y>0&&d[i-w])||(y<h-1&&d[i+w]))o[i]=col}this.d.set(o)}
 canvas(){const[c,g]=cv(this.w,this.h);g.putImageData(this.img,0,0);return c}}
function ramp(p,v,x,y){v=clamp(v,0,.9999)*(p.length-1);const i=Math.floor(v);return p[Math.min(p.length-1,i+(dith(x|0,y|0,v-i)?1:0))]}

// ===================== MULTI-FORMAT : API D'ADAPTATION =====================
// Hauteur native 288 (monde dessiné pour 288 lignes). Échelle entière s=ceil(hÉcran/288) => lignes visibles hÉcran/s
// (>=252, le surplus est rogné verticalement, ancre ?vy=0..1). Sinon (rognage >12,5%) échelle fractionnaire.
// Largeur native W=ceil(lÉcran/s). 5120x1440 -> s=5, W=1024 (= œuvre d'origine, pixel pour pixel).
function viewFor(tw,th){tw=Math.max(1,tw|0||5120);th=Math.max(1,th|0||1440);let s=Math.ceil(th/H-1e-9),pp=true;if(th/s<H*.875){s=th/H;pp=false}return{tw,th,s,pp,W:Math.max(200,Math.ceil(tw/s-1e-9))}}
const VIEW=viewFor(+Q.get('w')||innerWidth,+Q.get('h')||innerHeight);
const W=Q.has('nw')?Math.max(200,+Q.get('nw')|0):VIEW.W;
const K=W/1024;                       // facteur de largeur (1 en 32:9)
const MX=x=>x*K;                      // éléments « diffus » (végétation, nuages, rayons) : étirement uniforme
const CNT=n=>Math.round(n*K);         // quantités proportionnelles à la largeur
const KEEP=(i,salt=0)=>K>=1||hash(i,9100+salt)<K; // éclaircissement déterministe des listes fixes
// Ancres clés : LX(x@480, x@1024, mode) interpole entre la composition 16:9 (480) et l'originale (1024).
// W>1024 : 'L' reste à gauche, 'R' suit le bord droit, défaut proportionnel. W<480 : recadrage centré du layout 480.
const LX=(a,b,m)=>Math.round(W>=1024?b+(m==='L'?0:m==='R'?W-1024:(W-1024)*b/1024):W>=480?a+(b-a)*(W-480)/544:a-(480-W)/2);
const OA=LX(44,148,'L')-148;          // décalage du groupe falaise + cascade (cascade à x=148 d'origine)
const T1=LX(160,290),T2=LX(296,762),TPL=LX(404,922,'R'),CAPX=LX(228,548),EGX=LX(108,418),OP=LX(300,532)-532;
const BK=236+OA,O1=T1-290,O2=T2-762,OE=TPL-922,UFOX=CAPX+12;
// GX : listes fixes (plantes, rochers, lianes, couronnes) : x<260 suit la falaise, x>840 suit le temple, milieu interpolé.
const GX=(OA===0&&OE===0)?(x=>x):(x=>x<=260?x+OA:x>=840?x+OE:260+OA+(x-260)*(580+OE-OA)/580);
const MIDZ=x=>x>260&&x<840;           // zone centrale (éclaircie si compressée)
window.AMBIANT={W,H,K,view:VIEW,anchors:{fall:148+OA,tree1:T1,tree2:T2,temple:TPL,capy:CAPX,egret:EGX,bank:BK},MX,LX,GX};

// ===================== PALETTES =====================
const FERN=pal(['#0e2e16','#174220','#22582a','#317034','#4a8c3c','#6aa848']);
const LEAF=pal(['#0c2a14','#15401d','#1f5626','#2c6e30','#40883a','#5ea446','#80c050']);
const LEAFL=pal(['#123a1a','#1d5424','#2a6e2c','#3e8a34','#5aa640','#7cc24e','#a6dc68']);
const CALP=pal(['#0f2a22','#17402e','#20553a','#2d6c46','#468a58','#6aa870','#9cc890']);
const BLUEL=pal(['#10302c','#18463c','#22584a','#2f6e5a','#46886c','#62a282']);
const MID=pal(['#122a1a','#193a22','#224c2a','#2d6032','#3c7439','#528a42','#6ea04c']);
const FAR=pal(['#1a3832','#21453a','#2a5341','#35624a','#447353','#56845c']);
const CAN=pal(['#0a1d11','#102d18','#173f20','#1f5328','#2a6a31','#3c843a','#5aa046','#7cba52']);
const BARK=pal(['#1c1510','#2b2119','#3c2e22','#51402f','#68533d','#826b4e']);
const MOSS=pal(['#1f3e1d','#2c5626','#3d702e','#568a38','#74a444']);
const ROCK=pal(['#23282a','#303739','#40494a','#525d5b','#67746d','#818c80','#9ea68f']);
const SOIL=pal(['#100c08','#19130e','#241b14','#31251a','#403122']);
const STONE=pal(['#3b382f','#524d3f','#6a6450','#837c63','#a0987a','#bdb493']);
const FLOW=['#e8402f','#ff8a2a','#ffd84a','#f070b0','#fff4ea','#b070f0','#ff5a7a'].map(P);
const OUT=P('#06120a');

// ===================== BIG STRUCTURES =====================
function crown(b,cx,cy,r,p,o={}){const sx=o.sx||1.15,sy=o.sy||1,lb=o.lb||0,rough=o.rough===undefined?.55:o.rough,fq=o.fq||1;
 const x0=Math.floor(cx-r*sx*1.3),x1=Math.ceil(cx+r*sx*1.3),y0=Math.floor(cy-r*sy*1.3),y1=Math.ceil(cy+r*sy*1.3);
 for(let y=y0;y<=y1;y++){if(y<0||y>=b.h)continue;for(let x=x0;x<=x1;x++){if(x+b.dx<0||x+b.dx>=b.w)continue;
  const nx=(x-cx)/(r*sx),ny=(y-cy)/(r*sy),d=Math.hypot(nx,ny);
  const th=.84+(fbm2(N2,x*.23*fq+cx,y*.23*fq,2)-.5)*rough*1.5;
  if(d>th)continue;
  let v=.5-nx*.26-ny*.42+(fbm2(N3,x*.32*fq,y*.32*fq,3)-.5)*1.05+lb;
  v+=(N2(x*.11+cx*.3,y*.11)-.5)*.35;
  if(d>th-.1)v-=.14;
  if(N3(x*.9+3,y*.9)>.8&&v>.35)v+=.15;
  b.set(x,y,ramp(p,v,x,y))}}}

function genMount(towers,base,pl,veg,off,haze,hz0){
 const b=new Buf();const top=new Float32Array(W),tid=new Int16Array(W);
 for(let x=0;x<W;x++){let ty=base-fbm1(x*.012+off)*24,id=-1;
  for(let i=0;i<towers.length;i++){const t=towers[i],dx=Math.abs(x-t.x)/t.w;if(dx<1){const hh=t.h*Math.pow(1-dx*dx,.32)+(N1(x*.35+i*9)-.5)*2.5;if(base-hh<ty){ty=base-hh;id=i}}}
  top[x]=ty;tid[x]=id}
 for(let x=0;x<W;x++)for(let y=Math.floor(top[x]);y<WY;y++){
  const id=tid[x];let v=.45;
  if(id>=0){const t=towers[id],rel=(x-t.x)/t.w;v=.64-rel*.5}
  v+=(fbm2(N2,x*.4+off,y*.045,2)-.5)*.55;
  const dt=y-top[x];if(dt<1.5)v+=.3;
  let p=pl;if(veg&&dt>1&&fbm2(N3,x*.2+off,y*.2,2)>.55)p=veg;
  let c=ramp(p,v,x,y);
  const hz=clamp((y-hz0)/40,0,1);if(dith(x,y,hz*.9))c=ramp(haze,.4+v*.3,x,y);
  b.set(x,y,c)}
 return b.canvas()}

function genMist(w,h,dens,off){const b=new Buf(w,h);
 for(let y=0;y<h;y++){const f=Math.sin(Math.PI*y/h);for(let x=0;x<w;x++){
  const n=lerp(fbm2(N2,(x-w)*.018+off,y*.14,3),fbm2(N2,x*.018+off,y*.14,3),x/w);
  if(dith(x,y,(n-.38)*2.6*f*dens))b.set(x,y,pack(255,255,255))}}
 return b.canvas()}

function genCanopyFar(){const b=new Buf();
 for(let x=0;x<W;x++)for(let y=204+Math.floor(N1(x*.1)*4);y<WY;y++)b.set(x,y,ramp(FAR,.12+N2(x*.3,y*.3)*.2,x,y));
 const cs=[];for(let x=-10;x<W+10;x+=rnd(6,12)){let cy=199+(fbm1(x*.02+50)-.5)*18,r=rnd(6,11);if(R()<.14){cy-=rnd(10,22);r+=rnd(3,7)}cs.push([x,cy,r])}
 cs.sort((a,c)=>a[1]-c[1]);for(const[x,cy,r]of cs)crown(b,x,cy,r,FAR,{fq:1.4});
 return b.canvas()}

// ---------- MID LAYER (cliff, temple, trees behind river, bank) ----------
const META={};
function genMid(){const b=new Buf();
 // mid trees
 for(let i=0,nT=Math.round(22*(W+10-230-OA)/804);i<nT;i++){const x=rnd(230+OA,W+10),cy=rnd(150,188),r=rnd(9,16);
  for(let y=Math.floor(cy+r*.4);y<216;y++)for(let k=0;k<3;k++)b.set(x+k-1,y,ramp(BARK,.2+k*.15,x+k,y));
  crown(b,x,cy,r,MID,{sy:.9})}
 // emergent kapok trees
 for(const[kx,ky,kr]of[[LX(236,578),116,24],[LX(120,362),138,18],[LX(452,985),128,20]]){
  for(let y=ky;y<216;y++){const w=y>200?5+(y-200)*.4:4;for(let k=0;k<w;k++)b.set(kx-w/2+k,y,ramp(BARK,.15+k/w*.5,kx+k,y))}
  for(let s=-1;s<=1;s+=2)for(let j=0;j<kr*1.2;j++)b.set(kx+s*j,ky+4-j*.35,BARK[2]);
  crown(b,kx,ky-2,kr,MID,{sx:2,sy:.5,lb:.08})}
 // temple
 b.dx=OE;const cx=922,base=224;META.temple={cx:cx+OE};
 const tiers=[150,124,100,78,56];let top=base;
 for(let k=0;k<tiers.length;k++){const hw=tiers[k]/2,th=11,y0=base-(k+1)*th;
  for(let y=y0;y<y0+th;y++)for(let x=Math.floor(cx-hw);x<cx+hw;x++){const row=y-y0,off=((y>>2)&1)*3,bx=Math.floor((x+off)/6),by=y>>2;
   let v=.3+hash(bx,by)*.34;if((x+off)%6===0||y%4===0)v=.1;
   if(row===0)v=.8;else if(row===1)v=Math.max(v,.58);
   if(x>cx+hw-6)v-=.22;if(x<cx-hw+3)v+=.1;
   const sx=Math.abs(x-cx);if(sx<7){v=(y%2===0)?.72:.38;if(sx>=6)v=.15}
   let c=ramp(STONE,v,x,y);
   if(hash(bx,by+99)<.06&&sx>=7&&row>1)c=STONE[0];
   if(fbm2(N3,x*.15,y*.22,2)>.57&&row<6&&dith(x,y,.75))c=ramp(MOSS,v+.15,x,y);
   b.set(x,y,c)}
  top=y0}
 const sw=18,sh=24,sy=top-sh;
 for(let y=sy;y<top;y++)for(let x=cx-sw;x<cx+sw;x++){let v=.35+hash(x>>2,y>>2)*.3;if(y<sy+4){v=.7;if(Math.abs(x-cx)>sw-1)v=.5}if(x>cx+sw-4)v-=.2;
  let c=ramp(STONE,v,x,y);if(fbm2(N3,x*.2,y*.2,2)>.6&&dith(x,y,.6))c=ramp(MOSS,v,x,y);b.set(x,y,c)}
 for(let x=cx-sw-3;x<cx+sw+3;x++)for(let y=sy-3;y<sy;y++)b.set(x,y,ramp(STONE,y===sy-3?.85:.55,x,y));
 for(let x=cx-10;x<cx+10;x++)for(let y=sy-7;y<sy-3;y++)b.set(x,y,ramp(STONE,.5+(y===sy-7?.3:0),x,y));
 // face
 const ey=sy+9;for(const ex of[cx-7,cx+4]){b.rect(ex,ey,4,2,STONE[0]);b.rect(ex,ey-2,4,1,STONE[4])}
 b.rect(cx-1,ey,2,5,STONE[1]);
 for(let y=top-10;y<top;y++)for(let x=cx-5;x<cx+5;x++){if(y===top-10&&(x===cx-5||x===cx+4))continue;b.set(x,y,P('#0e0c09'))}
 b.rect(cx-6,top-11,12,1,STONE[4]);
 META.templeEyes=[[cx-5+OE,ey+1],[cx+6+OE,ey+1]];META.templeDoor=[cx+OE,top-3];
 // pillars & rubble
 for(const[px,ph]of[[842,26],[1010,18]]){for(let y=base-ph;y<base+2;y++)for(let x=px;x<px+6;x++)b.set(x,y,ramp(STONE,.3+(x-px)/6*-.2+.4+(y%5===0?-.3:0),x,y));b.rect(px-1,base-ph-2,8,2,STONE[4])}
 for(let i=0;i<14;i++){const rx=rnd(830,1024),ry=base+rnd(-2,3),rw=rint(3,6);for(let y=0;y<3;y++)for(let x=0;x<rw;x++)b.set(rx+x,ry+y,ramp(STONE,.6-y*.2,rx+x,ry+y))}
 // strangler roots on temple & vines
 for(let i=0;i<5;i++){let x=cx+14+i*6+rnd(-2,2);for(let y=sy-2;y<base;y++){x+=Math.sin(y*.2+i)*.5;b.set(x,y,ramp(BARK,.55+Math.sin(y*.3)*.1,x,y));if(i%2)b.set(x+1,y,BARK[2])}}
 crown(b,cx+26,sy-12,11,MID,{lb:.05});
 for(let i=0;i<26;i++){const k=rint(0,4),hw=tiers[k]/2,vx=cx+rnd(-hw+2,hw-2);if(Math.abs(vx-cx)<8)continue;const vy=base-(k+1)*11,L=rint(4,16);
  for(let j=0;j<L;j++){const x=vx+Math.sin(j*.5)*.6;b.set(x,vy+j,MOSS[1+(j%3===0?1:0)]);if(j%3===1)b.set(x+(j%2?1:-1),vy+j,MOSS[3])}}
 b.dx=OA;// cliff
 const ctop=x=>x<142?60+x*.36+(fbm1(x*.05+7)-.5)*20:x<186?(x<147||x>181?110:114):116+(x-186)*1.35+(fbm1(x*.08)-.5)*8;
 META.ctop=ctop;
 for(let x=0;x<252;x++){const t=Math.floor(ctop(x));if(t>=WY)continue;for(let y=t;y<WY;y++){
  const bx=Math.floor(x/6+N1(y*.2)*2),by=Math.floor(y/4+N1(x*.13)*1.5);
  let v=.36+hash(bx,by)*.34-(y-t)/420+(x<40?.05:0);
  const ledge=((y+Math.floor(N1(x*.07)*7))%14);if(ledge===0)v=.1;else if(ledge===1)v+=.26;
  if(N2(x*.9,y*.07)<.15)v=.08;
  if(x>140&&x<188)v-=.22;
  let c=ramp(ROCK,v,x,y);
  if((ledge===1||ledge===2||y-t<3)&&fbm2(N3,x*.2,y*.2,2)>.44&&!(x>144&&x<184))c=ramp(MOSS,v,x,y);
  b.set(x,y,c)}}
 for(let i=0;i<40;i++){const x=rnd(4,250);if(x>140&&x<188)continue;const y=rnd(ctop(x)+8,WY-8);if(y>=WY)continue;for(let k=0;k<6;k++){b.set(x+k-3,y-Math.abs(k-2.5)*.6,MOSS[2+(k%2)]);}b.set(x,y+1,MOSS[1])}
 for(let x=-6;x<252;x+=rnd(6,11)){if(x>138&&x<190)continue;crown(b,x,ctop(clamp(x,0,251))-2,rnd(5,10),MID,{sx:1.3,sy:.75,lb:.06})}
 b.dx=0;// bank behind river
 const bt=new Float32Array(W);META.bankTop=bt;
 for(let x=0;x<W;x++){const nb=214+(fbm1(x*.03+90)-.5)*10;bt[x]=x<BK?WY:x<BK+26?lerp(WY-2,nb,(x-BK)/26):nb}
 for(let x=BK;x<W;x++){const t=Math.floor(bt[x]);for(let y=t;y<WY;y++){const d=y-t;let c;
